spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=VALUE
  jpa:
    # Session-per-request (OSIV) masks lazy-loading problems and holds the Hibernate
    # session open for the whole HTTP request. The only lazy association in the model
    # (Referee.matches) is never traversed, so nothing relies on it — see RS-75.
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  ai:
    mcp:
      server:
        # Off unless the `mcp` profile is active (see application-mcp.yml). Spring AI's
        # HTTP transport has no authentication whatsoever, so POST /mcp must not exist in
        # a default run — the whole dataset would be readable by anything that can reach
        # the port. Authorizing the endpoint is RS-125.
        enabled: false
springdoc:
  swagger-ui:
    operationsSorter: method